spring.application.name=room-booking-back

# Loads the .env file when the app runs outside Docker; under Docker Compose
# the same variables are injected into the container environment instead.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Comma-separated origins of the front ends allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# First administrator, created only when the employee table is empty.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Demonstration mode: creates public demo accounts and sample data, and serves their password
# to the login page. Never enable it on a real installation.
app.demo.enabled=${DEMO_MODE:false}
app.demo.password=${DEMO_PASSWORD:}
