# Keeps the demonstration API awake: Render's free plan puts it to sleep after 15 minutes
# without requests, and waking it up takes about a minute and a half (RG-7-01).
name: Réveil de l'API de démonstration

on:
  schedule:
    - cron: "*/10 * * * *"
  # RG-7-03: can also be run by hand from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # RG-7-02: this endpoint does not read the database, so pinging it never wakes Neon up
      DEMO_API_URL: https://room-booking-api-vvpi.onrender.com/api/auth/demo-accounts
    steps:
      - name: Appeler l'API
        # CA-7-02: --fail makes the job fail, and show in the Actions tab, when the API does not answer
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 --output /dev/null "$DEMO_API_URL"
